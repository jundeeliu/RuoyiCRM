# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: ${RUOYI_MASTER_JDBC_URL}
                username: ${RUOYI_MASTER_DB_USER}
                password: ${RUOYI_MASTER_DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: false
            statViewServlet:
                enabled: false
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ${RUOYI_DRUID_ADMIN_USER:disabled}
                login-password: ${RUOYI_DRUID_ADMIN_PASSWORD:disabled}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: false
tenant:
    database:
        #mysql 用于连接数据库服务器以生成数据库,URL 不指定数据库
        host: ${RUOYI_TENANT_DB_HOST:localhost}
        port: ${RUOYI_TENANT_DB_PORT:3306}
        username: ${RUOYI_TENANT_DB_ADMIN_USER}
        password: ${RUOYI_TENANT_DB_ADMIN_PASSWORD}
    #生成数据库名称的前缀
    prefix: ryt_
